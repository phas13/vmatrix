name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          pytest

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vmatrix-backend ./backend

  push-ecr:
    name: Push to ECR
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Push to ECR
        run: echo "TODO - configure ECR credentials and push"

  deploy-ecs:
    name: Deploy to ECS
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' }}
    needs: push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS Fargate
        run: echo "TODO - configure ECS task definition and deploy"
